# yaml-language-server: $schema=https://raw.githubusercontent.com/mattsolo1/grove-docgen/main/schema/docgen.config.schema.json
enabled: true
title: "Grove Go Template"
description: "Template for creating Go-based CLI tools that integrate with the Grove ecosystem."
category: "Repository Templates"
settings:
  system_prompt: "default"
  rules_file: "docs.rules"
  temperature: 0.3
readme:
  generate_toc: true
  template: docs/README.md.tpl
  output: README.md
  source_section: overview
  strip_lines: 2

sections:
  - name: "overview"
    title: "Overview"
    order: 1
    prompt: "prompts/01-overview.md"
    output: "01-overview.md"
